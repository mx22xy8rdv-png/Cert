

name: iCert7 IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project iCert7.xcodeproj \
            -scheme iCert7 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iCert7.app Payload/
          zip -r iCert7.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iCert7-IPA
          path: iCert7.ipa
          retention-days: 7
