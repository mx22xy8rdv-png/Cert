name: iCert7
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.icert7
    TARGETED_DEVICE_FAMILY: "1"
targets:
  iCert7:
    type: application
    platform: iOS
    sources:
      - path: iCert7
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: iCert 7
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
